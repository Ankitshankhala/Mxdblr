# =============================================================================
# MXDBLR — Docker Compose (production, single-host behind nginx)
#
# Required environment variables in a .env file at this directory:
#   POSTGRES_PASSWORD   — Postgres password (REQUIRED, no default — compose
#                         fails fast rather than booting with a known password)
#   JWT_SECRET          — Must match api JWT_SECRET
#   NEXT_PUBLIC_API_URL — Public-facing API URL (browser requests)
#   SENTRY_DSN          — Optional; enables error reporting in api + web
#
# All published ports bind to 127.0.0.1 — nginx (host) is the only public
# entrypoint, so Postgres/API/web are never reachable directly from the internet.
#
# Usage:
#   docker compose up --build          # first run
#   docker compose up -d               # background
#   docker compose down -v             # stop + remove volumes
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mxdblr
      POSTGRES_USER: mxdblr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only — DB must never be exposed on the VPS public IP.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mxdblr"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mxdblr:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/mxdblr
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      PORT: 4000
      # No-op unless set — src/lib/observability.ts guards on this.
      SENTRY_DSN: ${SENTRY_DSN:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      WHATSAPP_BUSINESS_NUMBER: ${WHATSAPP_BUSINESS_NUMBER:-}
    ports:
      # Loopback only — nginx (api.mxdblr.com) proxies to 127.0.0.1:4000.
      - "127.0.0.1:4000:4000"
    volumes:
      # MED-11 fix: without this, locally-uploaded images (the Cloudinary
      # fallback path) are lost on every container rebuild/redeploy.
      # Strongly prefer configuring real Cloudinary credentials in prod so
      # this fallback path isn't relied on at all.
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Must be passed as a build arg — NEXT_PUBLIC_* vars are compiled
        # into the browser bundle at build time, not read at container runtime.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mxdblr.com/api}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_STAT_DEALERS: ${NEXT_PUBLIC_STAT_DEALERS:-}
        NEXT_PUBLIC_STAT_SKUS: ${NEXT_PUBLIC_STAT_SKUS:-}
    environment:
      NODE_ENV: production
      # Kept for reference only — has no effect on the already-built client bundle.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mxdblr.com/api}
      # INTERNAL_API_URL points to the api service name inside the Docker network
      INTERNAL_API_URL: http://api:4000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      # Loopback only — nginx (mxdblr.com) proxies to 127.0.0.1:3000.
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  api_uploads:

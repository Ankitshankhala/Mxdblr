# =============================================================================
# MXDBLR — Nginx BOOTSTRAP configuration (HTTP only, no TLS)
#
# Use this FIRST, before any certificate exists. The full mxdblr.conf references
# /etc/letsencrypt/live/... files that Certbot has not created yet, so enabling
# that file first makes `nginx -t` fail — and on this shared box a broken config
# means herotvmounting.com cannot reload either.
#
# Order of operations:
#   1. Install THIS file, reload, confirm mxdblr.com serves the app over HTTP
#   2. Run Certbot — it rewrites this file in place, adding the TLS blocks and
#      the HTTP→HTTPS redirect:
#        sudo certbot --nginx -d mxdblr.com -d www.mxdblr.com
#        sudo certbot --nginx -d api.mxdblr.com
#   3. Nothing else to do. mxdblr.conf in this repo documents the end state
#      Certbot produces; you do not need to install it manually.
#
# Install:
#   sudo cp nginx/mxdblr-bootstrap.conf /etc/nginx/sites-available/mxdblr.conf
#   sudo ln -s /etc/nginx/sites-available/mxdblr.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: no `default_server` anywhere below. This box already has a default site
# (herotvmounting.com); claiming it would hijack every unmatched hostname.
# =============================================================================

# Upstream names are GLOBAL across every file nginx loads. Prefixed so they can
# never collide with the other site's config — a duplicate name stops nginx from
# starting at all, taking both sites down.
upstream mxdblr_api {
    server 127.0.0.1:4000;
    keepalive 64;
}

upstream mxdblr_web {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── API subdomain ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.mxdblr.com;

    # Uploaded images are served by the API process from its own uploads/ dir.
    client_max_body_size 8m;

    location / {
        proxy_pass         http://mxdblr_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         'upgrade';
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ── Main portal ───────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name mxdblr.com www.mxdblr.com;

    location / {
        proxy_pass         http://mxdblr_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         'upgrade';
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static/ {
        proxy_pass http://mxdblr_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

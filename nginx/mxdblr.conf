# =============================================================================
# MXDBLR — Nginx reverse proxy configuration
#
# Domains served:
#   mxdblr.com / www.mxdblr.com  →  Next.js web app (port 3000)
#   api.mxdblr.com               →  Express API     (port 4000)
#
# SSL certificates managed by Certbot (Let's Encrypt).
# Run after cert provisioning:
#   sudo certbot --nginx -d mxdblr.com -d www.mxdblr.com
#   sudo certbot --nginx -d api.mxdblr.com
#
# Copy to: /etc/nginx/sites-available/mxdblr.conf
# Enable:  sudo ln -s /etc/nginx/sites-available/mxdblr.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream api_backend {
    server 127.0.0.1:4000;
    keepalive 64;
}

upstream web_frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── Redirect all HTTP to HTTPS ────────────────────────────────────────────────
server {
    listen 80;
    server_name mxdblr.com www.mxdblr.com api.mxdblr.com;
    return 301 https://$host$request_uri;
}

# ── API subdomain ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.mxdblr.com;

    ssl_certificate     /etc/letsencrypt/live/api.mxdblr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mxdblr.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         'upgrade';
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ── Main portal ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name mxdblr.com www.mxdblr.com;

    ssl_certificate     /etc/letsencrypt/live/mxdblr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mxdblr.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers — applied to all responses from this server block
    add_header X-Frame-Options            "SAMEORIGIN"                        always;
    add_header X-Content-Type-Options     "nosniff"                           always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    # Main application proxy
    location / {
        proxy_pass         http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         'upgrade';
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static chunks — immutable, 1-year cache
    location /_next/static/ {
        proxy_pass http://web_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

name: MXDBLR CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch to avoid stale deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Security: reject any PR that contains hardcoded secrets ────────────────
  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded JWT secrets in source
        run: |
          if grep -r "fallback-dev-secret\|mxd-dev-secret\|JWT_SECRET.*=.*[\"']" api/src/; then
            echo "FATAL: Hardcoded JWT secret found in source code"
            exit 1
          fi
          echo "No hardcoded JWT secrets found"

      - name: Check OTP bypass is not enabled in api/.env
        run: |
          if grep -q "ENABLE_OTP_BYPASS=true" api/.env 2>/dev/null; then
            echo "FATAL: OTP bypass is enabled in api/.env — must not be committed"
            exit 1
          fi
          echo "OTP bypass check passed"

      - name: Check .env files are not committed
        run: |
          if git ls-files | grep -E "^(api|web)/\.env$|^(api|web)/\.env\.local$"; then
            echo "FATAL: Real .env file committed to repository"
            exit 1
          fi
          echo "No real .env files committed"

  # ── API: typecheck + dependency audit ──────────────────────────────────────
  api-checks:
    name: API — Typecheck + Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=src/prisma/schema.prisma

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Dependency security audit
        run: npm audit --audit-level=high

  # ── Web: typecheck + dependency audit ──────────────────────────────────────
  web-checks:
    name: Web — Typecheck + Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Dependency security audit
        run: npm audit --audit-level=high

  # ── API smoke tests — auth/OTP, cart/inquiry, admin CRUD against real Postgres ──
  api-tests:
    name: API — Smoke Tests
    runs-on: ubuntu-latest
    needs: [security-check]
    defaults:
      run:
        working-directory: ./api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mxdblr
          POSTGRES_PASSWORD: mxdblr_ci_only
          POSTGRES_DB: mxdblr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mxdblr:mxdblr_ci_only@localhost:5432/mxdblr_test
      # CI-only secret for JWT signing inside the ephemeral test job — never deployed
      JWT_SECRET: 4f8a2c91d7e3b5061a9c8d2f7b4e0a3c6d9f1e8b5a2c7d4f0e3b6a9c1d8e5f2b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=src/prisma/schema.prisma

      - name: Apply migrations
        run: npx prisma migrate deploy --schema=src/prisma/schema.prisma

      - name: Run smoke tests
        run: npm test

  # ── Build API — confirms dist/index.js is emitted cleanly ──────────────────
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: [security-check, api-checks, api-tests]
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=src/prisma/schema.prisma

      - name: Compile TypeScript
        run: npm run build

      - name: Confirm build output exists
        run: ls dist/index.js

  # ── Build Web — confirms Next.js standalone output is emitted cleanly ───────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [security-check, web-checks]
    defaults:
      run:
        working-directory: ./web
    env:
      # Provide a build-time value so Next.js does not error on NEXT_PUBLIC_* references
      NEXT_PUBLIC_API_URL: https://api.mxdblr.com/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Confirm standalone server output exists
        run: ls .next/standalone/server.js

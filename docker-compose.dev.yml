# =============================================================================
# MXDBLR — Docker Compose (LOCAL DEV, one command, hot-reload)
#
# Runs Postgres + API (nodemon) + Web (next dev) with your source mounted, so
# edits reload live. No build step, no .env required — dev defaults are inline.
# First boot installs deps into named volumes and auto-migrates + seeds the DB.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up          # foreground (Ctrl-C to stop)
#   docker compose -f docker-compose.dev.yml up -d       # background
#   docker compose -f docker-compose.dev.yml down        # stop
#   docker compose -f docker-compose.dev.yml down -v     # stop + wipe DB/deps
#
#   Web  → http://localhost:3000
#   API  → http://localhost:4000/health
#
# Default admin (from api seed): check api/src/prisma/seed.ts output on first run.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mxdblr
      POSTGRES_USER: mxdblr
      POSTGRES_PASSWORD: mxdblr
    ports:
      - "5432:5432"
    volumes:
      - dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mxdblr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:20-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://mxdblr:mxdblr@postgres:5432/mxdblr
      JWT_SECRET: dev_secret_change_me
      PORT: "4000"
      # SENTRY_DSN intentionally unset → monitoring is a no-op in dev.
    ports:
      - "4000:4000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # Install deps (first run only — cached in the named volume), generate the
    # Prisma client, push the schema, seed baseline + catalog (both idempotent
    # upserts), then start nodemon. Seeds are safe to re-run on every boot.
    command: >
      sh -c "npm install &&
             npm run db:generate &&
             npm run db:push &&
             (npm run db:seed || true) &&
             (npx ts-node src/prisma/seed-catalog.ts || true) &&
             npm run dev"

  web:
    image: node:20-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      # Browser talks to the API on the host-published port.
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      # Server-side (SSR) fetches use the internal Docker network name.
      INTERNAL_API_URL: http://api:4000
      JWT_SECRET: dev_secret_change_me
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    command: >
      sh -c "npm install &&
             npm run dev"

volumes:
  dev_pg:
  api_node_modules:
  web_node_modules:
  api_uploads:
